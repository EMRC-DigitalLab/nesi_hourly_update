name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/emrc-digitallab/nesi-hourly-update
  APP_DIR: nesi  # relative to the deploy user's home on the VPS

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production-deploy
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          EOF

      - name: Upload compose file
        run: |
          ssh vps "mkdir -p $APP_DIR"
          scp compose.yml vps:$APP_DIR/compose.yml

      - name: Write .env from GitHub secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          HEALTHCHECK_URL_GENCO: ${{ secrets.HEALTHCHECK_URL_GENCO }}
          HEALTHCHECK_URL_DISCO: ${{ secrets.HEALTHCHECK_URL_DISCO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RERUN_SECRET: ${{ secrets.RERUN_SECRET }}
          REPORT_FROM: ${{ vars.REPORT_FROM }}
          REPORT_TO: ${{ vars.REPORT_TO }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          DASHBOARD_USERS: ${{ vars.DASHBOARD_USERS }}
        run: |
          test -n "$DB_PASSWORD" || { echo "DB_PASSWORD secret is not set"; exit 1; }
          # Sent over SSH stdin, never as a command-line argument; file is owner-only.
          {
            echo "DB_HOST=host.docker.internal"
            echo "DB_PORT=3306"
            echo "DB_NAME=jksutauf_nesidb"
            echo "DB_USER=nesi_scraper"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "HEALTHCHECK_URL_GENCO=$HEALTHCHECK_URL_GENCO"
            echo "HEALTHCHECK_URL_DISCO=$HEALTHCHECK_URL_DISCO"
            echo "RESEND_API_KEY=$RESEND_API_KEY"
            echo "REPORT_FROM=$REPORT_FROM"
            echo "REPORT_TO=$REPORT_TO"
            echo "PUBLIC_BASE_URL=$PUBLIC_BASE_URL"
            echo "RERUN_SECRET=$RERUN_SECRET"
            echo "DASHBOARD_USERS=$DASHBOARD_USERS"
            echo "IMAGE_TAG=${{ github.sha }}"
          } | ssh vps "umask 077 && cat > $APP_DIR/.env"

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Registry login goes to a private DOCKER_CONFIG so it never touches the
          # credentials other services on this VPS use; the token expires with this job.
          ssh vps "bash -s" <<EOF
          set -euo pipefail
          cd $APP_DIR
          docker network inspect nesi_net >/dev/null 2>&1 \
            || docker network create --subnet 172.30.0.0/24 nesi_net
          export DOCKER_CONFIG=\$PWD/.docker
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          # This script arrives on stdin, so docker commands get </dev/null (and -T)
          # to stop them swallowing the lines after them.
          docker compose pull </dev/null
          docker logout ghcr.io
          docker compose run --rm -T scraper check-db </dev/null
          docker compose up -d --remove-orphans </dev/null
          docker inspect nesi_scraper >/dev/null  # fail here, not later, if it didn't start
          # Remove older nesi images only; other services' images are left alone.
          docker image ls $IMAGE --format '{{.Repository}}:{{.Tag}}' \
            | grep -v ":${{ github.sha }}\$" | xargs -r docker image rm || true
          EOF

      - name: Wait for healthy container
        run: |
          for i in $(seq 1 12); do
            status=$(ssh vps "docker inspect -f '{{.State.Health.Status}}' nesi_scraper")
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 10
          done
          ssh vps "docker logs --tail 50 nesi_scraper"
          exit 1
