# Host nginx site for the NESI re-run site (served by the scraper container on 127.0.0.1:8101).
# Install:
#   sudo cp deploy/nginx/nesi-alert.raven-emrc.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/nesi-alert.raven-emrc.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nesi-alert.raven-emrc.com     # adds HTTPS + redirect, auto-renews

limit_req_zone $binary_remote_addr zone=nesi_auth:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=nesi_site:1m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name nesi-alert.raven-emrc.com;

    client_max_body_size 8k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sign-in and email re-run links: tight limit against guessing/spam.
    location ~ ^/(login|auth|rerun)$ {
        limit_req zone=nesi_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8101;
    }

    location / {
        limit_req zone=nesi_site burst=30 nodelay;
        proxy_pass http://127.0.0.1:8101;
    }
}
