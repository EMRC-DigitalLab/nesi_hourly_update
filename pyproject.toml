[project]
name = "nesi-hourly-update"
version = "2.0.0"
description = "Hourly niggrid.org GENCO generation and DISCO load scrapers"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
